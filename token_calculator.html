<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 计算器 - LMArena Bridge</title>
    <style>
        /* 使用与admin.html相同的深色科技风格 */
        :root {
            --bg-deep: linear-gradient(180deg, #090e16 0%, #0a1220 100%);
            --bg-elev: linear-gradient(135deg, rgba(16,28,48,0.85), rgba(9,16,30,0.9));
            --line-weak: #162339;
            --line-strong: #223650;
            --text-main: #d9e5ff;
            --text-dim: #8fa0bf;
            --btn-bg: #0e1a2d;
            --btn-hover: #15263f;
            --btn-active: #132745;
            --btn-border: #223650;
            --accent: #2aa8ff;
            --accent-soft: rgba(42,168,255,0.35);
            --accent-faint: rgba(42,168,255,0.12);
            --card-bg: rgba(16,28,48,0.6);
            --surface: #0e1a2d;
            --surface-2: #0b1626;
            --surface-3: #0b1422;
            --notch: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line-strong);
        }

        .header h1 {
            font-size: 2rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(42,168,255,0.3);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .card {
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--line-strong);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.03);
            padding: 20px;
            margin-bottom: 20px;
            clip-path: polygon(
                0 var(--notch), var(--notch) 0,
                calc(100% - var(--notch)) 0, 100% var(--notch),
                100% calc(100% - var(--notch)), calc(100% - var(--notch)) 100%,
                var(--notch) 100%, 0 calc(100% - var(--notch))
            );
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--line-weak);
        }

        .card-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--btn-bg);
            color: var(--text-main);
            text-decoration: none;
        }

        .btn:hover {
            background: var(--btn-hover);
            border-color: var(--accent-soft);
        }

        .btn-primary {
            background: rgba(42, 168, 255, 0.2);
            border-color: var(--accent-soft);
            color: var(--accent);
        }

        .btn-primary:hover {
            background: rgba(42, 168, 255, 0.3);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.75rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .form-input, .form-select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            font-size: 0.875rem;
            background: var(--surface-2);
            color: var(--text-main);
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(42, 168, 255, 0.1);
        }

        textarea {
            min-height: 200px;
            resize: vertical;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .result-card {
            padding: 15px;
            background: var(--surface-2);
            border-radius: 6px;
            border: 1px solid var(--line-weak);
            transition: all 0.2s;
        }

        .result-card:hover {
            border-color: var(--accent-soft);
        }

        .result-card.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        .result-card-title {
            font-size: 0.875rem;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .result-card-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
        }

        .result-card-hint {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 5px;
        }

        .result-card-error {
            font-size: 0.8rem;
            color: #ef4444;
        }

        .text-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            padding: 15px;
            background: var(--surface-2);
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .text-info-item {
            text-align: center;
        }

        .text-info-label {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .text-info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .compare-section {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: start;
        }

        .compare-result {
            padding: 20px;
            background: var(--surface-2);
            border-radius: 6px;
            border: 1px solid var(--line-weak);
        }

        .compare-vs {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-dim);
            padding-top: 30px;
        }

        .difference-card {
            margin-top: 20px;
            padding: 20px;
            background: rgba(42, 168, 255, 0.1);
            border: 1px solid var(--accent-soft);
            border-radius: 6px;
            text-align: center;
        }

        .difference-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--line-weak);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            border: 1px solid transparent;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-dim);
            background: transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text-main);
            background: var(--surface-2);
        }

        .tab.active {
            color: var(--accent);
            background: var(--surface);
            border-color: var(--line-strong);
            border-bottom-color: var(--surface);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--line-strong);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid currentColor;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .badge-info {
            background: rgba(42, 168, 255, 0.2);
            color: var(--accent);
            border-color: var(--accent-soft);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .compare-section {
                grid-template-columns: 1fr;
            }

            .compare-vs {
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧮 Token 计算器</h1>
            <div class="header-actions">
                <a href="/admin" class="btn">← 返回管理面板</a>
            </div>
        </div>

        <!-- 标签页导航 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('calculate')">📊 计算Token</button>
            <button class="tab" onclick="switchTab('compare')">⚖️ 对比分词器</button>
        </div>

        <!-- 计算Token标签页 -->
        <div id="tab-calculate" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h3>输入文本</h3>
                    <button class="btn btn-primary" onclick="calculateTokens()">
                        🔢 计算Token
                    </button>
                </div>
                <div class="form-group">
                    <textarea id="input-text" placeholder="在此输入要计算token的文本...&#10;&#10;支持中文、英文、混合文本等"></textarea>
                </div>
            </div>

            <div id="calculate-results" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h3>文本统计</h3>
                    </div>
                    <div id="text-info" class="text-info"></div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>Token 计算结果</h3>
                        <span class="badge badge-info">使用所有可用分词器</span>
                    </div>
                    <div id="token-results" class="results-grid"></div>
                </div>
            </div>

            <div id="calculate-loading" class="card" style="display: none;">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    正在计算...
                </div>
            </div>
        </div>

        <!-- 对比分词器标签页 -->
        <div id="tab-compare" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3>对比设置</h3>
                    <button class="btn btn-primary" onclick="compareTokenizers()">
                        ⚖️ 开始对比
                    </button>
                </div>
                
                <div class="form-group">
                    <label class="form-label">输入文本</label>
                    <textarea id="compare-text" placeholder="在此输入要对比的文本..."></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label class="form-label">分词器 1</label>
                        <select id="tokenizer1" class="form-select">
                            <option value="tiktoken_cl100k">Tiktoken (cl100k_base) - GPT-4</option>
                            <option value="tiktoken_o200k">Tiktoken (o200k_base) - GPT-4o</option>
                            <option value="anthropic">Anthropic - Claude-3</option>
                            <option value="gemma">Gemma Tokenizer - Gemini</option>
                            <option value="deepseek">DeepSeek Tokenizer</option>
                            <option value="estimate">字符估算</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">分词器 2</label>
                        <select id="tokenizer2" class="form-select">
                            <option value="tiktoken_cl100k">Tiktoken (cl100k_base) - GPT-4</option>
                            <option value="tiktoken_o200k">Tiktoken (o200k_base) - GPT-4o</option>
                            <option value="anthropic" selected>Anthropic - Claude-3</option>
                            <option value="gemma">Gemma Tokenizer - Gemini</option>
                            <option value="deepseek">DeepSeek Tokenizer</option>
                            <option value="estimate">字符估算</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="compare-results" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h3>对比结果</h3>
                    </div>
                    
                    <div class="compare-section">
                        <div id="compare-result-1" class="compare-result"></div>
                        <div class="compare-vs">VS</div>
                        <div id="compare-result-2" class="compare-result"></div>
                    </div>

                    <div id="compare-difference" class="difference-card"></div>
                </div>
            </div>

            <div id="compare-loading" class="card" style="display: none;">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    正在对比...
                </div>
            </div>
        </div>
    </div>

    <script>
        // 切换标签页
        function switchTab(tabName) {
            // 更新标签按钮状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // 更新标签内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // 计算Token
        async function calculateTokens() {
            const text = document.getElementById('input-text').value;
            if (!text.trim()) {
                alert('请输入文本');
                return;
            }

            const resultsDiv = document.getElementById('calculate-results');
            const loadingDiv = document.getElementById('calculate-loading');

            resultsDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                const response = await fetch('/api/admin/calculate_tokens', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    throw new Error('计算失败');
                }

                const data = await response.json();
                
                // 显示文本统计
                const textInfo = data.text_info;
                document.getElementById('text-info').innerHTML = `
                    <div class="text-info-item">
                        <div class="text-info-label">字符数</div>
                        <div class="text-info-value">${textInfo.char_count.toLocaleString()}</div>
                    </div>
                    <div class="text-info-item">
                        <div class="text-info-label">单词数</div>
                        <div class="text-info-value">${textInfo.word_count.toLocaleString()}</div>
                    </div>
                    <div class="text-info-item">
                        <div class="text-info-label">中文字符</div>
                        <div class="text-info-value">${textInfo.chinese_char_count.toLocaleString()}</div>
                    </div>
                    <div class="text-info-item">
                        <div class="text-info-label">行数</div>
                        <div class="text-info-value">${textInfo.line_count.toLocaleString()}</div>
                    </div>
                `;

                // 显示Token结果
                let resultsHTML = '';
                for (const [key, result] of Object.entries(data.results)) {
                    if (result.error) {
                        resultsHTML += `
                            <div class="result-card error">
                                <div class="result-card-title">${result.name || key}</div>
                                <div class="result-card-error">❌ ${result.error}</div>
                                ${result.install_cmd ? `<div class="result-card-hint">安装: ${result.install_cmd}</div>` : ''}
                                ${result.hint ? `<div class="result-card-hint">${result.hint}</div>` : ''}
                            </div>
                        `;
                    } else {
                        resultsHTML += `
                            <div class="result-card">
                                <div class="result-card-title">${result.name}</div>
                                <div class="result-card-value">${result.token_count.toLocaleString()}</div>
                                <div class="result-card-hint">${result.model_hint || ''}</div>
                                ${result.method ? `<div class="result-card-hint">${result.method}</div>` : ''}
                            </div>
                        `;
                    }
                }
                document.getElementById('token-results').innerHTML = resultsHTML;

                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';

            } catch (error) {
                loadingDiv.style.display = 'none';
                alert('计算失败: ' + error.message);
            }
        }

        // 对比分词器
        async function compareTokenizers() {
            const text = document.getElementById('compare-text').value;
            const tokenizer1 = document.getElementById('tokenizer1').value;
            const tokenizer2 = document.getElementById('tokenizer2').value;

            if (!text.trim()) {
                alert('请输入文本');
                return;
            }

            if (tokenizer1 === tokenizer2) {
                alert('请选择不同的分词器进行对比');
                return;
            }

            const resultsDiv = document.getElementById('compare-results');
            const loadingDiv = document.getElementById('compare-loading');

            resultsDiv.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                const response = await fetch('/api/admin/compare_tokenizers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: text,
                        tokenizer1: tokenizer1,
                        tokenizer2: tokenizer2
                    })
                });

                if (!response.ok) {
                    throw new Error('对比失败');
                }

                const data = await response.json();

                // 显示分词器1结果
                const t1 = data.tokenizer1;
                document.getElementById('compare-result-1').innerHTML = `
                    <h4 style="color: var(--accent); margin-bottom: 15px;">${t1.name || t1.id}</h4>
                    ${t1.error ? `
                        <div style="color: #ef4444;">❌ ${t1.error}</div>
                        ${t1.hint ? `<div style="color: var(--text-dim); font-size: 0.8rem; margin-top: 5px;">${t1.hint}</div>` : ''}
                    ` : `
                        <div style="font-size: 2.5rem; font-weight: bold; color: var(--accent);">
                            ${t1.token_count.toLocaleString()}
                        </div>
                        <div style="color: var(--text-dim); margin-top: 5px;">tokens</div>
                        ${t1.model_hint ? `<div style="color: var(--text-dim); font-size: 0.8rem; margin-top: 10px;">${t1.model_hint}</div>` : ''}
                    `}
                `;

                // 显示分词器2结果
                const t2 = data.tokenizer2;
                document.getElementById('compare-result-2').innerHTML = `
                    <h4 style="color: var(--accent); margin-bottom: 15px;">${t2.name || t2.id}</h4>
                    ${t2.error ? `
                        <div style="color: #ef4444;">❌ ${t2.error}</div>
                        ${t2.hint ? `<div style="color: var(--text-dim); font-size: 0.8rem; margin-top: 5px;">${t2.hint}</div>` : ''}
                    ` : `
                        <div style="font-size: 2.5rem; font-weight: bold; color: var(--accent);">
                            ${t2.token_count.toLocaleString()}
                        </div>
                        <div style="color: var(--text-dim); margin-top: 5px;">tokens</div>
                        ${t2.model_hint ? `<div style="color: var(--text-dim); font-size: 0.8rem; margin-top: 10px;">${t2.model_hint}</div>` : ''}
                    `}
                `;

                // 显示差异
                if (data.difference) {
                    const diff = data.difference;
                    const sign = diff.absolute > 0 ? '+' : '';
                    document.getElementById('compare-difference').innerHTML = `
                        <div style="margin-bottom: 10px; color: var(--text-dim);">差异分析</div>
                        <div class="difference-value">${sign}${diff.absolute.toLocaleString()} tokens</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
                            <div>
                                <div style="color: var(--text-dim); font-size: 0.8rem;">比值</div>
                                <div style="font-size: 1.2rem; color: var(--text-main);">${diff.ratio}</div>
                            </div>
                            <div>
                                <div style="color: var(--text-dim); font-size: 0.8rem;">百分比差异</div>
                                <div style="font-size: 1.2rem; color: var(--text-main);">${diff.percentage}</div>
                            </div>
                        </div>
                    `;
                    document.getElementById('compare-difference').style.display = 'block';
                } else {
                    document.getElementById('compare-difference').style.display = 'none';
                }

                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';

            } catch (error) {
                loadingDiv.style.display = 'none';
                alert('对比失败: ' + error.message);
            }
        }

        // 监听回车键
        document.getElementById('input-text').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                calculateTokens();
            }
        });

        document.getElementById('compare-text').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                compareTokenizers();
            }
        });

        // 加载自定义分词器到下拉列表
        async function loadCustomTokenizersToSelect() {
            try {
                const response = await fetch('/api/admin/custom_tokenizers');
                if (!response.ok) return;
                
                const data = await response.json();
                if (!data.tokenizers || data.tokenizers.length === 0) return;
                
                const select1 = document.getElementById('tokenizer1');
                const select2 = document.getElementById('tokenizer2');
                
                // 添加分隔线和自定义分词器
                const separator = document.createElement('option');
                separator.disabled = true;
                separator.textContent = '── 自定义分词器 ──';
                
                const separator2 = separator.cloneNode(true);
                
                select1.appendChild(separator);
                select2.appendChild(separator2);
                
                for (const tokenizer of data.tokenizers) {
                    if (!tokenizer.available) continue;
                    
                    const option1 = document.createElement('option');
                    option1.value = `custom_${tokenizer.name}`;
                    option1.textContent = `${tokenizer.display_name} (自定义)`;
                    
                    const option2 = option1.cloneNode(true);
                    
                    select1.appendChild(option1);
                    select2.appendChild(option2);
                }
                
                console.log(`✅ 已加载 ${data.tokenizers.filter(t => t.available).length} 个自定义分词器`);
                
            } catch (error) {
                console.warn('加载自定义分词器失败:', error);
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadCustomTokenizersToSelect();
        });
    </script>
</body>
</html>
